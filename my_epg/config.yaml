defaults: # optional section
  timespan: "72" # optional, overridable per listing
  timezone: "America/New_York" # optional, overridable per listing
  appendAsterisk: true # optional, overridable per listing
  mediaportal: false # optional, overridable per listing
  nextpvr: false # optional, overridable per listing

listings:
